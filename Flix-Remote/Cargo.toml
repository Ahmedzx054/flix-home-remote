[package]
name = "flix-remote"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "The original single-page FLIX remote with direct phone-to-TV networking"
repository = "https://github.com/Flix-Remote/Flix-Remote"
[lib]
name = "dayapp"
[features]
default = ["mock"]
mock = ["day/mock"]
uikit = ["day/uikit", "dep:day-uikit", "dep:objc2", "dep:objc2-ui-kit"]
mdc = ["day/mdc", "dep:day-android"]
dom = ["day/dom", "dep:day-dom"]
[dependencies]
day = { git = "https://github.com/daybrite/day.git", tag = "v0.6.0" }
day-core = { git = "https://github.com/daybrite/day.git", tag = "v0.6.0" }
day-spec = { git = "https://github.com/daybrite/day.git", tag = "v0.6.0" }
day-pieces = { git = "https://github.com/daybrite/day.git", tag = "v0.6.0" }
day-uikit = { git = "https://github.com/daybrite/day.git", tag = "v0.6.0", optional = true }
day-android = { git = "https://github.com/daybrite/day.git", tag = "v0.6.0", optional = true }
day-dom = { git = "https://github.com/daybrite/day.git", tag = "v0.6.0", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-ui-kit = { version = "0.3", optional = true }
linkme = "0.3"
[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git", tag = "v0.6.0" }
[package.metadata.day.ios]
platform = "17.0"
swift = ["platform/ios/bridge"]
frameworks = ["WebKit", "Network", "Security", "Speech", "AVFoundation", "CryptoKit"]
swift-packages = [
 { url = "https://github.com/ionic-team/capacitor-swift-pm.git", exact = "8.5.3", products = ["Capacitor", "Cordova"] },
 { url = "https://github.com/h33h/iadb-ios.git", revision = "22902f6231c413f2d90accee68f0e59f1c9ea360", products = ["ADBCore"] },
 { path = "../node_modules/@capacitor/app", products = ["CapacitorApp"] },
 { path = "../node_modules/@capacitor/filesystem", products = ["CapacitorFilesystem"] },
 { path = "../node_modules/@capacitor/preferences", products = ["CapacitorPreferences"] },
 { path = "../node_modules/@capacitor/share", products = ["CapacitorShare"] },
]
[package.metadata.day.android]
java = ["platform/android/java", "build/bridge/java"]
res = ["platform/android/res"]
proguard = ["platform/android/proguard-rules.pro"]
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.ACCESS_WIFI_STATE", "android.permission.CHANGE_WIFI_MULTICAST_STATE"]
gradle-dependencies = ["com.github.MuntashirAkon:libadb-android:3.1.1", "org.conscrypt:conscrypt-android:2.5.3", "org.bouncycastle:bcpkix-jdk15to18:1.81", "com.squareup.okhttp3:okhttp:4.12.0"]
gradle-repositories = ["https://jitpack.io"]
