name: Day migration candidate
on:
  push:
    branches: [codex/day-appfair]
  workflow_dispatch:
concurrency:
  group: day-candidate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  appfair-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: appfair/appfair-apps/.github/actions/appfair-lint@main
        with:
          path: Flix-Remote
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    with:
      project-path: Flix-Remote
      day-version: v0.6.0
      targets: ios-uikit android-mdc web-dom
      preflight-checks: fmt check test clippy
      scripts: auto
      locales: ar en
      themes: light dark
      ios-profiles: iPhone=phone, iPad Pro=ipad
      android-profiles: medium_phone=phone, medium_tablet=tablet
      release-assets: false
      deploy-web: false
      update-day-deps: false
      post-pack-command: python3 ../scripts/day-native-review.py
      target-packages: |
        ios-uikit: go
      target-setup: |
        ios-uikit, android-mdc, web-dom: npm ci && npm run build && npm test
