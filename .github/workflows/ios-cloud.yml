name: iPhone cloud build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: unsigned device IPA for Windows signing, or simulator compilation
        required: true
        default: unsigned
        type: choice
        options: [unsigned, simulator]
permissions:
  contents: read
concurrency:
  group: ios-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: sshcore/go.mod
          cache: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          node --version
          go version
          python3 --version
      - name: Check distribution tools
        run: python3 -m unittest discover -s tests -p 'test_ios_*.py' -v
      - name: Build and package
        env:
          IOS_TARGET: ${{ inputs.target || 'unsigned' }}
        run: bash scripts/build-ios.sh "$IOS_TARGET"
      - name: Save device build
        if: inputs.target == 'unsigned' || github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomeRemote-iPhone-unsigned-${{ github.run_number }}
          path: |
            releases/HomeRemote-unsigned.ipa
            releases/ios-build.json
          if-no-files-found: error
          retention-days: 7
      - name: Save simulator proof
        if: inputs.target == 'simulator'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomeRemote-iPhone-simulator-${{ github.run_number }}
          path: releases/ios-build.json
          if-no-files-found: error
          retention-days: 7
